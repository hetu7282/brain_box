name: brain_box
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # // Cupertino Icons // #
  cupertino_icons: ^1.0.8

  # // Responsive UI // #
  sizer: ^3.0.5

  # // Default Splash Screen // #
  flutter_native_splash: ^2.4.7

  # // State Management // #
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # // Check Network Connectivity // #
  connectivity_plus: ^6.1.4
  shimmer: ^3.0.0

  # // API calling // #
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  path_provider: ^2.1.5

  # // Format Date & Time // #
  # intl: ^0.20.2

  # // Local Storage // #
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # // Device Information // #
  device_info_plus: ^11.5.0

  # // Permission Handler // #
  permission_handler: ^12.0.0+1

  # // Image pick from gallery & camera // #
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  path: ^1.9.1

  # // Pagination // #
  loading_animation_widget: ^1.3.0
  lazy_load_scrollview: ^1.3.0


  # // Message Bar // #
  toastification: ^3.0.3

  # // Routing // #
  go_router: ^16.0.0

  # // Global State Management // #
  get_it: ^8.0.3

  # // Translator // #
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  intl_translation: ^0.20.1


  # // UI Components // #
  flutter_advanced_switch: ^3.1.0
  dropdown_button2: ^2.3.9

  # // Audio Player // #
  audioplayers: ^6.5.1

  # // Game Engine // #
  flame: ^1.19.0
  flame_audio: ^2.1.0

  # // State Management // #
  provider: ^6.1.2

  # // Async Operations // #
  async: ^2.11.0
  flutter_masonry_view: ^0.0.2
  masonry_grid: ^1.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.1

  # // Haptics provided via platform HapticFeedback // #

flutter_assets:
  assets_path: assets/
  output_path: lib/src/config/constants
  filename: assets.dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/
    - assets/flags/
    - assets/image/
    - assets/image/theme/
    - assets/image/piece_by_piece/
    - assets/image/kings_gambit/
    - assets/image/kings_gambit/pieces/
    - assets/image/kings_gambit/pieces/classic/
    - assets/image/kings_gambit/pieces/letters/
    - assets/image/kings_gambit/pieces/angular/
    - assets/image/kings_gambit/pieces/8-bit/
    - assets/image/kings_gambit/pieces/videochess/
    - assets/image/kings_gambit/pieces/lewischessmen/
    - assets/image/kings_gambit/pieces/mexicocity/
    - assets/image/kings_gambit/pieces/simple/
    - assets/image/dinosaur/
    - assets/image/dinosaur/cacti/
    - assets/image/dinosaur/cacti/default/
    - assets/image/dinosaur/cacti/light/
    - assets/image/dinosaur/cacti/dark/
    - assets/image/dinosaur/cacti/cosmic/
    - assets/image/dinosaur/dino/
    - assets/image/dinosaur/dino/default/
    - assets/image/dinosaur/dino/light/
    - assets/image/dinosaur/dino/dark/
    - assets/image/dinosaur/dino/cosmic/
    - assets/image/dinosaur/ptera/
    - assets/image/no_internet/
    - assets/audio/
    - assets/json/

  # Uncomment and configure fonts when you add font files
  # fonts:
  #   - family: Bricolage
  #     fonts:
  #       - asset: assets/fonts/Bricolage-100.ttf
  #         weight: 100
  #       - asset: assets/fonts/Bricolage-200.ttf
  #         weight: 200
  #       - asset: assets/fonts/Bricolage-300.ttf
  #         weight: 300
  #       - asset: assets/fonts/Bricolage-400.ttf
  #         weight: 400
  #       - asset: assets/fonts/Bricolage-500.ttf
  #         weight: 500
  #       - asset: assets/fonts/Bricolage-600.ttf
  #         weight: 600

